    <text x="116" y="10" class="tiny">wk</text><rect x="144" y="3" width="46" height="7" rx="4" fill="#474b51"/><rect x="144" y="3" width="25" height="7" rx="4" fill="#75a7ff"/><text x="198" y="10" class="value">54%</text>
    <text x="232" y="10" class="tiny">30d</text><rect x="260" y="3" width="46" height="7" rx="4" fill="#474b51"/><rect x="260" y="3" width="15" height="7" rx="4" fill="#75a7ff"/><text x="314" y="10" class="value">32%</text>
  </g>

