  <g filter="url(#shadow)">
    <rect x="126" y="54" width="422" height="692" rx="20" fill="#0e1012" stroke="#34383f"/>
  </g>
  <text x="150" y="92" font-size="20" font-weight="800">使用量</text>
  <text x="414" y="91" class="muted" font-size="14">全部供应商</text>
  <path d="M508 79a10 10 0 1 0 2 8M508 79v9h-9" fill="none" stroke="#aeb3bc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="126" y1="110" x2="548" y2="110" stroke="#272b30"/>

  <rect x="146" y="126" width="382" height="38" rx="10" fill="#17191c" stroke="#30343a"/>
