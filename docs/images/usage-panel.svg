<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">dsh-hub-oauth-gateway multi-provider usage panel</title>
  <desc id="desc">Sanitized dark-theme preview showing a provider list, an account-detail flyout, and a compact twelve-month token activity heatmap.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202328"/>
      <stop offset="1" stop-color="#15171a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67a0ff"/>
      <stop offset="1" stop-color="#4176e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <pattern id="emptyGrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="10" height="10" rx="3" fill="#282b30"/>
    </pattern>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; fill:#f2f3f5 }
      .muted { fill:#969ba4 }
      .tiny { fill:#8b9099; font-size:12px }
      .label { fill:#f2f3f5; font-size:14px; font-weight:700 }
      .value { fill:#f7f8fa; font-size:13px; font-weight:700 }
    </style>
  </defs>

  <rect width="1400" height="860" rx="30" fill="url(#page)"/>
  <circle cx="1270" cy="70" r="230" fill="#2b3442" opacity=".48"/>
  <circle cx="1080" cy="850" r="310" fill="#1d2a3b" opacity=".42"/>

  <!-- DSH sidebar rail -->
  <rect x="28" y="30" width="68" height="800" rx="24" fill="#111315" stroke="#30343a"/>
  <g transform="translate(48 54)">
    <path d="M4 16c2-7 7-11 14-11 4 0 8 2 10 5-5 0-9 2-11 7 4-2 8-2 12 0-3 7-8 10-15 9-6-1-10-4-10-10Z" fill="#f3f4f6"/>
    <circle cx="23" cy="12" r="2" fill="#17191c"/>
  </g>
  <g fill="none" stroke="#9aa0aa" stroke-width="2" stroke-linecap="round">
    <circle cx="62" cy="142" r="11"/><path d="M62 136v12M56 142h12"/>
    <rect x="50" y="204" width="24" height="20" rx="5"/><path d="M56 210h12M56 217h8"/>
    <circle cx="62" cy="286" r="11"/><path d="M57 281l10 10M67 281l-10 10"/>
  </g>
  <rect x="42" y="680" width="40" height="40" rx="13" fill="#26354d"/>
  <g transform="translate(51 690)" fill="none" stroke="#78a8ff" stroke-width="2"><ellipse cx="11" cy="4" rx="9" ry="4"/><path d="M2 4v12c0 2 4 4 9 4s9-2 9-4V4M2 10c0 2 4 4 9 4s9-2 9-4"/></g>

