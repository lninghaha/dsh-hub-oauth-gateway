  <text x="596" y="573" class="tiny">今日 <tspan class="value">1.2m</tspan></text><text x="716" y="573" class="tiny">本月 <tspan class="value">8.8m</tspan></text><text x="844" y="573" class="tiny">累计 <tspan class="value">42m</tspan></text><text x="964" y="573" class="tiny">缓存命中 <tspan class="value">98.7%</tspan></text>

  <rect x="596" y="601" width="700" height="98" fill="url(#emptyGrid)"/>
