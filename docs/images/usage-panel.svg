  <g>
    <line x1="126" y1="293" x2="548" y2="293" stroke="#272b30"/>
    <rect x="148" y="313" width="30" height="30" rx="8" fill="#24272b" stroke="#3d4147"/><text x="163" y="334" text-anchor="middle" font-size="10" font-weight="800">DS</text>
    <text x="192" y="331" class="label">DeepSeek</text><text x="443" y="331" class="tiny">¥36.44</text><path d="M514 325l6 6-6 6" fill="none" stroke="#8f949d" stroke-width="2"/>
    <text x="192" y="355" class="tiny">API 余额 · 实时</text>
    <line x1="126" y1="374" x2="548" y2="374" stroke="#272b30"/>

