    <g transform="translate(192 436)"><text x="0" y="10" class="tiny">5h</text><rect x="28" y="3" width="46" height="7" rx="4" fill="#35393e"/><text x="82" y="10" class="value">0%</text><text x="116" y="10" class="tiny">wk</text><rect x="144" y="3" width="46" height="7" rx="4" fill="#35393e"/><rect x="144" y="3" width="7" height="7" rx="4" fill="#75a7ff"/><text x="198" y="10" class="value">14%</text></g>
